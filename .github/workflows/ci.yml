# Gate for pull requests: the app must build, typecheck and pass its tests,
# including the Firestore rules suite, before a change merges. On main the same
# run then publishes the build to GitHub Pages, at the base path configured in
# vite.config.ts, but only once every check has passed, so a red main is never
# published.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test-typecheck:
    name: Build, test and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:rules
      - run: npm run typecheck
      - if: github.event_name == 'push'
        uses: actions/configure-pages@v6
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: build-test-typecheck
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
