# Gate for pull requests: the app must build, typecheck and pass its tests
# before a change merges.
name: CI

on:
  pull_request:

jobs:
  build-test-typecheck:
    name: Build, test and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run typecheck
